---
# Routes argocd.k8s.stanikz.com to the Argo CD server through the shared
# Gateway. The HTTPRoute lives in the argocd namespace (where the Service is)
# and attaches to the Gateway in the gateway namespace via parentRefs.
#
# TLS is terminated at the Gateway (wildcard cert from cert-manager). Argo CD
# runs with server.insecure=true so argocd-server serves plain HTTP internally,
# making the Gateway the sole TLS terminator and avoiding double-TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "argocd.k8s.stanikz.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80