---
# Trivial first child of the app-of-apps root.
#
# This namespace exists purely to prove the reconciliation loop end to end:
# committing this file to Git and letting Argo CD create the namespace (with
# no manual `kubectl create`) demonstrates that Git is the source of truth and
# Argo CD is reconciling. Later platform services (OpenBao, monitoring,
# logging) will add their own manifests under gitops/platform/ and be picked
# up automatically by the recursing root Application.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    managed-by: argocd