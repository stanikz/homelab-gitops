---
- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: helm repo add {{ argocd_helm_repo_name }} {{ argocd_helm_repo_url }}
  register: argocd_helm_repo_add
  changed_when: "'has been added' in argocd_helm_repo_add.stdout"
  failed_when:
    - argocd_helm_repo_add.rc != 0
    - "'already exists' not in argocd_helm_repo_add.stderr"
  become: false

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false
  become: false

- name: Install or upgrade Argo CD
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ argocd_release_name }} {{ argocd_helm_repo_name }}/argo-cd
      --version {{ argocd_chart_version }}
      --namespace {{ argocd_namespace }}
      --create-namespace
      --set configs.params."server\.insecure"=true
  register: argocd_helm_install
  changed_when:
    - "'has been upgraded' in argocd_helm_install.stdout or 'has been installed' in argocd_helm_install.stdout"
  become: false

- name: Wait for Argo CD server rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ argocd_namespace }} rollout status deployment/argocd-server --timeout=5m
  changed_when: false
  become: false

- name: Wait for Argo CD repo-server rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ argocd_namespace }} rollout status deployment/argocd-repo-server --timeout=5m
  changed_when: false
  become: false

- name: Wait for Argo CD application controller rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ argocd_namespace }} rollout status statefulset/argocd-application-controller --timeout=5m
  changed_when: false
  become: false

- name: Apply the app-of-apps root Application
  ansible.builtin.command:
    cmd: kubectl apply -f {{ argocd_root_app_manifest }}
  register: argocd_root_app_apply
  changed_when:
    - "'created' in argocd_root_app_apply.stdout or 'configured' in argocd_root_app_apply.stdout"
  become: false