---
cert_manager_chart_version: "v1.19.3"
cert_manager_namespace: cert-manager
cert_manager_release_name: cert-manager
cert_manager_helm_repo_name: jetstack
cert_manager_helm_repo_url: https://charts.jetstack.io

cert_manager_install_crds: "true"
cert_manager_gateway_api_enabled: "true"

# Bitwarden item holding the Cloudflare API token (in the item's notes) and the
# ACME account email (in a custom field named "email"). Retrieved at runtime;
# neither value is stored in Git. Requires BW_SESSION to be exported, as with
# the infrastructure layer.
cert_manager_bw_item: "Cloudflare API - Token for DNS"

# ACME / DNS-01 settings. The DNS zone is public (in Certificate Transparency
# logs already), so it is kept here; the email is injected from Bitwarden.
cert_manager_dns_zone: "stanikz.com"