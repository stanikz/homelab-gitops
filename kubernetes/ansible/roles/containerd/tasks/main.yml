---
- name: Install pinned containerd version
  ansible.builtin.apt:
    name: "containerd={{ containerd_version }}"
    state: present
    update_cache: true

- name: Hold containerd package
  ansible.builtin.dpkg_selections:
    name: containerd
    selection: hold
  when: not ansible_check_mode

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ containerd_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode
